name = "thundermoon"
compatibility_date = "2026-06-21"
main = "worker.js"

# نطاقا الموقع يصلان الى هذا الـ Worker بمسارين في منطقة raadbadr.com (كما هما في Cloudflare اليوم).
# سجلات DNS للنطاقين تشير الى مشروع Cloudflare Pages القديم بالاسم نفسه، فلا يحذف ذلك المشروع:
# ربطهما كـ Custom Domains كما في مستر زاهي يرفضه Cloudflare (code 100117) ما دامت تلك السجلات موجودة.
routes = [
  { pattern = "raadbadr.com/*", zone_name = "raadbadr.com" },
  { pattern = "www.raadbadr.com/*", zone_name = "raadbadr.com" }
]

[assets]
directory = "./"
# Expose the assets binding to the Worker. Without this line env.ASSETS is
# undefined inside the Worker.
binding = "ASSETS"
