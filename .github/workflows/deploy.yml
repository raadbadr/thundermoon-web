name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # سر كلاودفلير يضيفه المالك مرة واحدة في اعدادات المستودع. قبل اضافته يتخطى
      # هذا العمل النشر بنجاح بدل ان يفشل ويرسل تنبيهات، وبعد اضافته يعمل تلقائيا.
      - id: token
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # الموقع ملفات ثابتة و worker.js بلا اعتماديات، فلا خطوة تثبيت قبل النشر
      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Skip (no CLOUDFLARE_API_TOKEN yet)
        if: steps.token.outputs.present != 'true'
        run: |
          echo "::notice title=Deploy skipped::اضف السر CLOUDFLARE_API_TOKEN في اعدادات المستودع ليصير النشر تلقائيا. النشر يتم حاليا يدويا بـ npx wrangler deploy."
